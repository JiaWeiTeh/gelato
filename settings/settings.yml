#-- GELATO configuration.
#-- Edit the values below, then save and close the file.

general:
    #-- Name shown in the welcome greeting (max 10 characters; longer names are truncated).
    #-- Set to null to disable the greeting.
    name: User
    #-- Interface language: en (English), cn (Chinese), katze (cat mode)
    def_language: en

artikel_normal:
    #-- Number of questions used when you press Enter at the "number of questions" prompt.
    #-- Positive integer, or null to use every word in the database.
    def_qs: null

artikel_challenge:
    #-- Number of hearts (lives). Positive integer, maximum 10.
    hearts: 3
