[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gelato"
dynamic = ["version"]
description = "GErman Learning Assist TOol: a terminal quiz for German articles and verb conjugations"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "tabulate",
    "openpyxl",
    "pyyaml",
    "colorama",
]

[project.urls]
Homepage = "https://github.com/JiaWeiTeh/gelato"

[project.scripts]
gelato = "gelato:run"

[tool.setuptools]
py-modules = ["gelato"]
packages = ["artikel", "functions", "language", "scoreboard", "settings", "verben"]

# the version number lives in functions/header.py, next to the banner that shows it
[tool.setuptools.dynamic]
version = {attr = "functions.header.version"}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
