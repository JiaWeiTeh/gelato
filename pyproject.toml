[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gelato"
version = "1.2.0"
description = "GErman Learning Assist TOol: a terminal quiz for German articles and verb conjugations"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "tabulate",
    "openpyxl",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/JiaWeiTeh/gelato"
Documentation = "https://gelato-language.readthedocs.io/"

[project.scripts]
gelato = "gelato:run"

[tool.setuptools]
py-modules = ["gelato"]
packages = ["artikel", "functions", "language", "scoreboard", "settings", "verben"]
